name: servicerswitch

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicerswitch}
      POSTGRES_USER: ${POSTGRES_USER:-servicerswitch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicerswitch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  engine:
    build:
      context: ./apps/engine
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ai:
    image: servicerswitch-ai:local
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://servicerswitch:servicerswitch@postgres:5432/servicerswitch}
      ENGINE_API_BASE: ${ENGINE_API_BASE:-http://engine:8080}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-nano}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-5-nano}
      AGENT_API_BASE: ${AGENT_API_BASE:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.openai.com/v1}
    ports:
      - "8000:8000"
    depends_on:
      engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  demo-init:
    image: servicerswitch-ai:local
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    profiles: ["demo"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://servicerswitch:servicerswitch@postgres:5432/servicerswitch}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python -m alembic -c alembic.ini upgrade head &&
        python -m app.retrieval.seed_demo
    restart: "no"

  web:
    build:
      context: ./apps/web
    environment:
      AI_SERVICE_URL: http://ai:8000
      ENGINE_SERVICE_URL: http://engine:8080
    ports:
      - "3000:3000"
    depends_on:
      ai:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000 >/dev/null 2>&1 && wget -q -O - http://127.0.0.1:3000/demo/case-0042-property-tax-bill-page-1.png >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
